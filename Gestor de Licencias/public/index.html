<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; }
    .glass-card { background: #050505; border: 1px solid #1a1a1a; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #333333; }
    
    input, select {
      background-color: #0a0a0a !important;
      border: 1px solid #1a1a1a !important;
      color: #ffffff !important;
    }
    input:focus, select:focus {
      border-color: #444444 !important;
    }
    
    .btn-primary {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }
    .btn-primary:hover {
      background-color: #e5e5e5;
    }
    
    .btn-secondary {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #333333;
    }
    .btn-secondary:hover {
      border-color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-white selection:text-black">
  
  <div class="max-w-6xl mx-auto p-8 relative z-10">
    
    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed top-8 right-8 bg-[#111111] border border-[#333333] text-white px-5 py-4 flex items-center gap-3 transform transition-all duration-300 translate-y-[-150%] opacity-0 z-50 shadow-2xl">
      <span class="material-symbols-outlined text-white">info</span>
      <span id="toastMessage" class="text-sm font-medium tracking-wide"></span>
    </div>
    
    <!-- Custom Confirm Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
      <div class="glass-card w-full max-w-sm p-8 transform scale-95 transition-transform duration-300 shadow-2xl" id="deleteModalContent">
        <h3 class="text-xl font-semibold text-white mb-3">Eliminar Licencia</h3>
        <p class="text-gray-400 text-sm mb-8 leading-relaxed">Esta acción es irreversible y el cliente perderá acceso al sistema inmediatamente.</p>
        <div class="flex gap-4">
          <button onclick="closeDeleteModal()" class="flex-1 btn-secondary py-3 text-sm font-medium transition-colors">Cancelar</button>
          <button id="confirmDeleteBtn" class="flex-1 btn-primary py-3 text-sm font-medium transition-colors">Confirmar</button>
        </div>
      </div>
    </div>
    
    <!-- Header -->
    <header class="flex items-center justify-between mb-12 border-b border-[#1a1a1a] pb-8 mt-4">
      <div class="flex items-center gap-5">
        <div class="w-12 h-12 flex items-center justify-center border border-[#333333] bg-[#0a0a0a]">
          <span class="material-symbols-outlined text-2xl text-white">fingerprint</span>
        </div>
        <div>
          <h1 class="text-2xl font-semibold tracking-tight text-white">Master Control</h1>
          <p class="text-gray-500 text-sm mt-1">Administración de Licencias</p>
        </div>
      </div>
      <div>
        <span class="px-3 py-1.5 border border-[#333333] text-gray-300 text-xs tracking-widest uppercase flex items-center gap-2 bg-[#050505]">
          <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> Sistema Activo
        </span>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Panel: Generate License -->
      <div class="lg:col-span-1">
        <div class="glass-card p-8 h-full">
          <h2 class="text-sm uppercase tracking-widest text-gray-400 mb-8 flex items-center gap-2 font-medium">
            <span class="material-symbols-outlined text-[18px]">add</span> Nueva Licencia
          </h2>
          
          <form id="generateForm" class="space-y-6">
            <div>
              <label class="block text-xs text-gray-500 uppercase tracking-widest mb-3">Cliente / Negocio</label>
              <input type="text" id="clientName" required class="w-full px-4 py-3 text-sm transition-colors outline-none" placeholder="Ej. Abarrotes San Juan">
            </div>
            
            <div>
              <label class="block text-xs text-gray-500 uppercase tracking-widest mb-3">Duración (Meses)</label>
              <select id="months" class="w-full px-4 py-3 text-sm transition-colors outline-none appearance-none rounded-none">
                <option value="1">1 Mes</option>
                <option value="3">3 Meses</option>
                <option value="6">6 Meses</option>
                <option value="12">12 Meses (1 Año)</option>
              </select>
            </div>
            
            <div>
              <label class="block text-xs text-gray-500 uppercase tracking-widest mb-3">Código de Máquina</label>
              <input type="text" id="machineId" required class="w-full px-4 py-3 text-sm transition-colors outline-none font-mono" placeholder="Hardware ID">
            </div>

            <button type="submit" class="w-full btn-primary py-4 text-sm font-semibold tracking-wide uppercase mt-6 transition-colors flex items-center justify-center gap-2">
              Generar
            </button>
          </form>
        </div>
      </div>

      <!-- Panel: Licenses List -->
      <div class="lg:col-span-2">
        <div class="glass-card p-8 h-full flex flex-col">
          <div class="flex items-center justify-between mb-8">
            <h2 class="text-sm uppercase tracking-widest text-gray-400 font-medium">
              Clientes Activos
            </h2>
            <button onclick="fetchLicenses()" class="text-gray-500 hover:text-white transition-colors">
              <span class="material-symbols-outlined text-[20px]">sync</span>
            </button>
          </div>

          <div class="overflow-x-auto flex-1">
            <table class="w-full text-left text-sm text-gray-300">
              <thead class="text-[11px] uppercase text-gray-500 border-b border-[#1a1a1a]">
                <tr>
                  <th class="px-4 py-4 font-medium tracking-widest">Cliente</th>
                  <th class="px-4 py-4 font-medium tracking-widest">Duración</th>
                  <th class="px-4 py-4 font-medium tracking-widest">Máquina</th>
                  <th class="px-4 py-4 font-medium tracking-widest">Expira</th>
                  <th class="px-4 py-4 font-medium tracking-widest">Estado</th>
                  <th class="px-4 py-4 text-right font-medium tracking-widest">Acciones</th>
                </tr>
              </thead>
              <tbody id="licensesTable" class="divide-y divide-[#1a1a1a]">
                <!-- Rows will be populated here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:4000/api';

    document.getElementById('generateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const clientInput = document.getElementById('clientName');
      const clientName = clientInput.value;
      const months = document.getElementById('months').value;
      const machineIdInput = document.getElementById('machineId');
      const machineId = machineIdInput.value;

      try {
        const res = await fetch(`${API_URL}/licenses`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_name: clientName, months, machine_id: machineId })
        });
        const data = await res.json();
        
        if (data.token) {
          navigator.clipboard.writeText(data.token).then(() => {
            showToast('Licencia generada exitosamente');
          }).catch(() => {
            showToast('Licencia generada (copia el token de la tabla)');
          });
          clientInput.value = '';
          machineIdInput.value = '';
          clientInput.focus();
          fetchLicenses();
        }
      } catch (err) {
        showToast('Error generando licencia', true);
      }
    });

    async function fetchLicenses() {
      try {
        const res = await fetch(`${API_URL}/licenses`);
        const data = await res.json();
        const tbody = document.getElementById('licensesTable');
        tbody.innerHTML = '';
        
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-12 text-center text-gray-600 uppercase tracking-widest text-[11px]">No hay licencias generadas</td></tr>`;
          return;
        }

        data.forEach(lic => {
          const expDate = new Date(lic.expires_at);
          const isExpired = expDate < new Date();
          
          const statusBadge = isExpired 
            ? `<span class="border border-[#444444] text-gray-400 px-2.5 py-1 text-[10px] uppercase tracking-widest bg-[#0a0a0a]">Vencida</span>`
            : `<span class="border border-white text-black bg-white px-2.5 py-1 text-[10px] uppercase tracking-widest font-medium">Activa</span>`;

          tbody.innerHTML += `
            <tr class="hover:bg-[#0a0a0a] transition-colors group">
              <td class="px-4 py-4 font-medium text-white">${lic.client_name}</td>
              <td class="px-4 py-4 text-gray-400">${lic.months} Meses</td>
              <td class="px-4 py-4 text-xs font-mono text-gray-500" title="${lic.machine_id}">${lic.machine_id ? lic.machine_id.substring(0,8) + '...' : 'N/A'}</td>
              <td class="px-4 py-4 text-gray-400">${expDate.toLocaleDateString()}</td>
              <td class="px-4 py-4">${statusBadge}</td>
              <td class="px-4 py-4 text-right">
                <button onclick="copySpecificToken('${lic.token}')" class="text-gray-500 hover:text-white mr-3 transition-colors" title="Copiar Token">
                  <span class="material-symbols-outlined text-[18px]">content_copy</span>
                </button>
                <button onclick="deleteLicense(${lic.id})" class="text-gray-500 hover:text-white transition-colors" title="Revocar/Eliminar">
                  <span class="material-symbols-outlined text-[18px]">delete</span>
                </button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error('Error fetching licenses', err);
      }
    }

    let licenseToDelete = null;

    function deleteLicense(id) {
      licenseToDelete = id;
      const modal = document.getElementById('deleteModal');
      const content = document.getElementById('deleteModalContent');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    }

    function closeDeleteModal() {
      licenseToDelete = null;
      const modal = document.getElementById('deleteModal');
      const content = document.getElementById('deleteModalContent');
      modal.classList.add('opacity-0', 'pointer-events-none');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (licenseToDelete) {
        try {
          await fetch(`${API_URL}/licenses/${licenseToDelete}`, { method: 'DELETE' });
          fetchLicenses();
          showToast('Licencia eliminada');
        } catch (e) {
          showToast('Error al eliminar licencia', true);
        }
      }
      closeDeleteModal();
    });

    function copySpecificToken(token) {
      navigator.clipboard.writeText(token);
      showToast('Clave copiada al portapapeles');
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      const icon = toast.querySelector('.material-symbols-outlined');
      
      toastMsg.textContent = message;
      icon.textContent = isError ? 'error' : 'check';

      toast.classList.remove('translate-y-[-150%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-150%]', 'opacity-0');
      }, 3000);
    }

    // Initial fetch
    fetchLicenses();
  </script>
</body>
</html>
